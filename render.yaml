services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: jobpilot-backend
    env: python
    region: singapore # Or oregon / frankfurt
    buildCommand: "cd backend && pip install -r requirements.txt && python -m playwright install chromium"
    startCommand: "cd backend && PYTHONPATH=. uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: SMART_MOCK
      - key: DEMO_MODE
        value: "false"

  # 2. React Vite Frontend Static Site
  - type: web
    name: jobpilot-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
