version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=jobpilot-production-secret-key-2026
      - DATABASE_URL=sqlite+aiosqlite:///./jobpilot.db
      - AI_PROVIDER=SMART_MOCK
      - DEMO_MODE=true
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
